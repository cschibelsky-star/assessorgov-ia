services:
  assessorgov_app_hml:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assessorgov_app_hml
    restart: unless-stopped
    environment:
      APP_NAME: "AssessorGov IA"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://cultura.hml.vitrineiapro.com.br
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: assessorgov_db_hml
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-assessorgov}
      DB_USERNAME: ${DB_USERNAME:-assessorgov}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    ports:
      - "127.0.0.1:32768:80"
    depends_on:
      assessorgov_db_hml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default
      - vitrine_net

  assessorgov_db_hml:
    image: mariadb:11.4
    container_name: assessorgov_db_hml
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-assessorgov}
      MARIADB_USER: ${DB_USERNAME:-assessorgov}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - assessorgov_db_hml_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  vitrine_net:
    external: true

volumes:
  assessorgov_db_hml_data:
